<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>루트플래너</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f8f9fa;--border:#e4e6ea;
  --text:#1c1c1e;--text2:#6e6e73;--text3:#aeaeb2;
  --accent:#2563eb;--accent-light:#eff6ff;--danger:#dc2626;--success:#16a34a;
  --r:12px;--rl:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* ── 로그인 ── */
#login-screen{position:fixed;inset:0;background:var(--accent);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-icon{width:40px;height:40px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center}
.login-logo-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-title{font-size:18px;font-weight:700}
.login-sub{font-size:12px;color:var(--text3);margin-top:2px}
.login-field{margin-bottom:14px}
.login-field label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:600}
.login-field input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:15px;font-family:inherit;outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.login-btn:disabled{opacity:.5}
.login-err{font-size:12px;color:var(--danger);margin-top:10px;text-align:center;min-height:18px}

/* ── 앱 레이아웃 ── */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#panel{width:340px;flex-shrink:0;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;box-shadow:2px 0 8px rgba(0,0,0,.06);z-index:10}
#map-area{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%}

/* ── 헤더 ── */
#panel-header{padding:12px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.header-top{display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-text{font-size:14px;font-weight:700;flex:1}
.user-chip{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 8px}
.user-email{font-size:11px;color:var(--text2);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer}
#loading-bar{height:2px;background:linear-gradient(90deg,var(--accent),#93c5fd,var(--accent));background-size:200%;animation:ldAnim 1s linear infinite;display:none;flex-shrink:0}
@keyframes ldAnim{0%{background-position:0%}100%{background-position:200%}}

/* ── 탭 ── */
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;padding:9px 4px;font-size:12px;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}

/* ── 스크롤 바디 ── */
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;overscroll-behavior:contain}
.sbody::-webkit-scrollbar{width:3px}
.sbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sec{margin-bottom:18px}
.sec-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px}

/* ── 지역 선택 ── */
.sido-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.sido-btn{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s;font-weight:500}
.sido-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.select-all{font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none;padding:2px 0;margin-bottom:5px;display:none;font-weight:600}
.gu-grid{display:none;flex-wrap:wrap;gap:5px;max-height:120px;overflow-y:auto}
.gu-chip{padding:4px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s;white-space:nowrap}
.gu-chip.on{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}

/* ── 학교 종류 ── */
.type-row{display:flex;gap:5px}
.type-chip{flex:1;padding:8px 4px;border:1.5px solid var(--border);border-radius:var(--r);font-size:12px;cursor:pointer;background:var(--surface);color:var(--text2);text-align:center;transition:all .15s;font-weight:500}
.type-chip.all.on{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.type-chip.e.on{background:#dcfce7;color:#166534;border-color:#86efac}
.type-chip.m.on{background:#fef9c3;color:#854d0e;border-color:#fde047}
.type-chip.h.on{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}

/* ── 방문 설정 ── */
.num-row{display:flex;gap:8px}
.num-item{flex:1}
.num-item label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600}
.num-ctrl{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.num-ctrl button{width:36px;height:36px;border:none;background:none;font-size:18px;cursor:pointer;color:var(--text2);flex-shrink:0}
.num-ctrl button:active{background:var(--surface2)}
.num-ctrl span{flex:1;text-align:center;font-size:14px;font-weight:600}
.count-info{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}

/* ── 출발/도착지 ── */
.place-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--surface2);color:var(--text);margin-bottom:7px;pointer-events:none}
.fixed-places{display:flex;gap:5px;flex-wrap:wrap}
.fixed-btn{padding:7px 13px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s}
.fixed-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── CTA ── */
.sfooter{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:7px}
#gen-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--rl);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,.3);transition:all .15s}
#gen-btn:disabled{background:#93c5fd;box-shadow:none;cursor:not-allowed}
#recommend-btn{width:100%;padding:11px;background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);border-radius:var(--rl);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
#recommend-btn:hover{background:var(--accent-light)}
#recommend-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Day 선택 바 (지도 위) ── */
#day-selector{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;display:none;background:var(--surface);border-radius:var(--rl);box-shadow:0 2px 12px rgba(0,0,0,.15);padding:8px;display:none}
.day-sel-inner{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:auto;max-width:calc(100vw - 360px - 40px)}
.day-sel-btn{flex-shrink:0;padding:7px 14px;border:2px solid;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface);transition:all .15s;white-space:nowrap}
.day-sel-btn.active{color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.unassigned-badge{background:#6b7280;color:#fff;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700;margin-left:4px}

/* ── 지도 범례 ── */
.map-legend-box{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:500;display:none;max-width:130px}
.map-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-bottom:3px}
.map-legend-item:last-child{margin-bottom:0}

/* ── 결과 패널 ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.stat-card{background:var(--surface2);border-radius:var(--r);padding:9px;text-align:center;border:1px solid var(--border)}
.stat-val{font-size:19px;font-weight:700}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px}
.act-row{display:flex;gap:5px;margin-bottom:12px}
.act-btn{flex:1;padding:9px 4px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:4px}
.act-btn:active{background:var(--surface2)}

/* ── Day 탭 ── */
.day-tabs-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.day-tab-btn{flex-shrink:0;padding:7px 13px;border:2px solid;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface);transition:all .15s;text-align:center}
.day-tab-btn.active{color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* ── Day 디테일 ── */
.day-info-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surface2);border-radius:var(--r);margin-bottom:8px}
.resort-btn{padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:11px;font-weight:600;cursor:pointer;color:var(--text2)}

/* ── 학교 리스트 아이템 ── */
.stop{display:flex;align-items:center;gap:7px;padding:7px 3px;border-bottom:1px solid var(--border)}
.stop:last-child{border-bottom:none}
.stop.sortable-ghost{opacity:.3;background:var(--accent-light)}
.drag-handle{cursor:grab;color:var(--text3);font-size:17px;flex-shrink:0;padding:3px 2px;touch-action:none;user-select:none;-webkit-user-select:none}
.stop-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-sub{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.stop-badge{font-size:10px;padding:2px 5px;border-radius:5px;font-weight:600}
.badge-e{background:#dcfce7;color:#166534}
.badge-m{background:#fef9c3;color:#854d0e}
.badge-h{background:#ede9fe;color:#5b21b6}
.kakao-btn{padding:3px 7px;background:#FEE500;color:#3C1E1E;border-radius:5px;font-size:10px;font-weight:700;text-decoration:none;white-space:nowrap}
.move-select{border:1px solid var(--border);border-radius:5px;cursor:pointer;color:var(--text3);padding:2px 4px;font-size:10px;font-weight:600;background:var(--surface);outline:none;max-width:52px}
.move-btn{display:none}
.stop-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:3px 5px;font-size:15px;line-height:1}
.stop-del:active{color:var(--danger)}
.add-stop-btn{width:100%;padding:8px;border:1.5px dashed var(--border);border-radius:var(--r);background:none;color:var(--text3);font-size:12px;cursor:pointer;margin-top:7px;font-weight:500}

/* ── 저장된 루트 ── */
.saved-card{border:1.5px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;background:var(--surface)}
.saved-name{font-size:13px;font-weight:600}
.saved-meta{font-size:11px;color:var(--text3);margin-top:3px}
.empty-state{text-align:center;padding:40px 16px;color:var(--text3);font-size:13px}

/* ── 모달 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:500px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px 30px;width:100%;max-width:480px}
@media(min-width:500px){.modal{border-radius:24px;padding:22px 20px}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px}
.modal h3{font-size:15px;font-weight:700;margin-bottom:12px}
.modal input{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;font-family:inherit;outline:none;margin-bottom:8px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:7px;margin-top:4px}
.modal-btns button{flex:1;padding:11px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border)}
.btn-cancel{background:var(--surface);color:var(--text)}
.btn-ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.school-results{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r);margin-top:6px;display:none}
.school-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)}
.school-item:last-child{border-bottom:none}
.school-item:active{background:var(--surface2)}

/* ── 토스트 ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1}

/* ── 모바일 ── */
@media(max-width:680px){
  #app{flex-direction:column}
  #panel{width:100%;height:52vh;min-height:280px;max-height:68vh;box-shadow:none;border-top:1px solid var(--border);order:2}
  #map-area{flex:1;order:1;min-height:180px}
  .day-sel-inner{max-width:calc(100vw - 24px)}
  #day-selector{left:12px;right:12px;transform:none;width:auto}
}
@media print{
  @page{margin:10mm 8mm;size:A4}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #panel-header,#tabs,.sfooter,#map-area,.act-row,.day-tabs-row{display:none!important}
  #app{display:block;height:auto}
  #panel{width:100%;height:auto;overflow:visible;box-shadow:none;border:none}
  .sbody{overflow:visible;max-height:none;padding:0}
  #tab-result{display:block!important}
  #tab-plan,#tab-saved{display:none!important}
  .drag-handle,.stop-del,.move-btn,.move-select,.kakao-btn,.resort-btn,.add-stop-btn,.day-info-bar .resort-btn{display:none!important}
  .day-info-bar{padding:4px 8px;margin-bottom:4px;page-break-inside:avoid}
  .stop{padding:3px 2px;border-bottom:0.5px solid #eee}
  .stop-num{width:16px;height:16px;font-size:8px;flex-shrink:0}
  .stop-name{font-size:10px;font-weight:500}
  .stop-sub{font-size:9px}
  .stop-badge{font-size:9px;padding:1px 4px}
  .stop-actions{gap:2px}
  .stats-grid{display:none}
  #day-detail{page-break-inside:avoid}
}
.fixed-btn.on,.place-fixed-btn.on{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
      </div>
      <div><div class="login-title">루트플래너</div><div class="login-sub">학교 영업 동선 최적화</div></div>
    </div>
    <div class="login-field"><label>이메일</label><input type="email" id="login-email" placeholder="이메일 입력" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="login-field"><label>비밀번호</label><input type="password" id="login-pw" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div id="panel">
    <div id="panel-header">
      <div class="header-top">
        <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg></div>
        <div class="logo-text">루트플래너</div>
        <div class="user-chip"><span class="user-email" id="user-email"></span><button class="logout-btn" onclick="doLogout()">로그아웃</button></div>
      </div>
    </div>
    <div id="loading-bar"></div>
    <div id="tabs">
      <button class="tab-btn active" onclick="switchTab('plan')">루트 설정</button>
      <button class="tab-btn" onclick="switchTab('result')" id="result-tab" style="display:none">결과 보기</button>
      <button class="tab-btn" onclick="switchTab('saved')">저장된 루트</button>
    </div>

    <!-- 루트 설정 -->
    <div class="sbody" id="tab-plan">
      <div class="sec">
        <div class="sec-label">지역 선택</div>
        <div class="sido-row" id="sido-row"></div>
        <button class="select-all" id="select-all-btn" onclick="toggleAllGu()">전체 선택</button>
        <div class="gu-grid" id="gu-grid"></div>
      </div>
      <div class="sec">
        <div class="sec-label">학교 종류</div>
        <div class="type-row">
          <div class="type-chip all on" onclick="toggleType('all')">전체</div>
          <div class="type-chip e" onclick="toggleType('초등학교')">초등</div>
          <div class="type-chip m" onclick="toggleType('중학교')">중등</div>
          <div class="type-chip h" onclick="toggleType('고등학교')">고등</div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-label">방문 일수</div>
        <div class="num-row">
          <div class="num-item">
            <label>방문 일수 (최대 50)</label>
            <div class="num-ctrl"><button onclick="adj('days',-1)">−</button><span id="days-val">3</span><button onclick="adj('days',1)">+</button></div>
          </div>
          <div class="num-item">
            <label>하루 최대 방문</label>
            <div class="num-ctrl"><button onclick="adj('max',-1)">−</button><span id="max-val">15</span><button onclick="adj('max',1)">+</button></div>
          </div>
        </div>
        <div class="count-info" id="count-info">지역을 선택하면 학교 수가 표시됩니다</div>
      </div>
      <div class="sec">
        <div class="sec-label">출발지</div>
        <input class="place-input" id="origin-input" readonly placeholder="아래에서 선택"/>
        <div class="fixed-places" id="origin-fixed-places"></div>
      </div>

// ── 알고리즘 ─────────────────────────────────────────────────
function haversine(a,b){
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function d2(a,b){return (a.lat-b.lat)**2+(a.lng-b.lng)**2}

// 균등 클러스터링 (±15% 허용)
function balancedKmeans(pts,k,iters=80){
  if(!pts.length) return [];
  k=Math.min(k,pts.length);
  const n=pts.length;
  const maxSize=Math.ceil(n/k*1.15); // ±15%
  const centers=[{...pts[Math.floor(Math.random()*n)]}];
  while(centers.length<k){
    const dists=pts.map(p=>Math.min(...centers.map(c=>d2(p,c))));
    const total=dists.reduce((a,b)=>a+b,0);
    let r=Math.random()*total,chosen=n-1;
    for(let i=0;i<n;i++){r-=dists[i];if(r<=0){chosen=i;break;}}
    centers.push({...pts[chosen]});
  }
  let labels=new Array(n).fill(0);
  for(let it=0;it<iters;it++){
    const counts=new Array(k).fill(0);
    const newLabels=new Array(n).fill(-1);
    pts.forEach((p,i)=>{
      const dists=centers.map(c=>d2(p,c));
      const best=dists.indexOf(Math.min(...dists));
      newLabels[i]=best;counts[best]++;
    });
    let adjusted=true,safety=0;
    while(adjusted&&safety<n*2){
      adjusted=false;safety++;
      for(let ci=0;ci<k;ci++){
        if(counts[ci]<=maxSize) continue;
        const members=pts.map((p,i)=>({i,p})).filter(({i})=>newLabels[i]===ci);
        let bestMove=null,bestGain=-Infinity;
        for(const{i,p}of members){
          for(let cj=0;cj<k;cj++){
            if(cj===ci||counts[cj]>=maxSize) continue;
            const gain=d2(p,centers[ci])-d2(p,centers[cj]);
            if(gain>bestGain){bestGain=gain;bestMove={i,cj};}
          }
        }
        if(bestMove){newLabels[bestMove.i]=bestMove.cj;counts[ci]--;counts[bestMove.cj]++;adjusted=true;}
      }
    }
    if(newLabels.every((l,i)=>l===labels[i])) break;
    labels=newLabels;
    centers.forEach((_,ci)=>{
      const sub=pts.filter((_,j)=>labels[j]===ci);
      if(!sub.length) return;
      centers[ci]={lat:sub.reduce((s,p)=>s+p.lat,0)/sub.length,lng:sub.reduce((s,p)=>s+p.lng,0)/sub.length};
    });
  }
  const cnt=Array.from({length:k},(_,i)=>labels.filter(l=>l===i).length);
  cnt.forEach((c,i)=>{if(c===0){const big=cnt.indexOf(Math.max(...cnt));const idx=labels.findIndex(l=>l===big);if(idx>=0){labels[idx]=i;cnt[big]--;cnt[i]++;}}});
  return labels;
}

function optimizeRoute(pts,startCoord,destCoord){
  if(!pts.length) return [];
  if(pts.length===1) return [0];
  const n=pts.length;
  let startIdx=0;
  if(startCoord){let bd=Infinity;pts.forEach((p,i)=>{const d=haversine(p,{lat:startCoord[0],lng:startCoord[1]});if(d<bd){bd=d;startIdx=i;}});}
  else{let mx=-Infinity;pts.forEach((p,i)=>{if(p.lat>mx){mx=p.lat;startIdx=i;}});}
  const vis=new Array(n).fill(false),ord=[startIdx];vis[startIdx]=true;
  for(let i=1;i<n;i++){const last=ord[ord.length-1];let best=-1,bd=Infinity;for(let j=0;j<n;j++){if(vis[j])continue;const d=haversine(pts[last],pts[j]);if(d<bd){bd=d;best=j;}}vis[best]=true;ord.push(best);}
  const start=startCoord?{lat:startCoord[0],lng:startCoord[1]}:pts[startIdx];
  const end=destCoord?{lat:destCoord[0],lng:destCoord[1]}:start;
  let improved=true;
  while(improved){improved=false;for(let i=0;i<n-1;i++){for(let j=i+1;j<n;j++){const a=i===0?start:pts[ord[i-1]],b=pts[ord[i]],c=pts[ord[j]],dd=j===n-1?end:pts[ord[j+1]];if(haversine(a,c)+haversine(b,dd)<haversine(a,b)+haversine(c,dd)-0.001){ord.splice(i,j-i+1,...ord.slice(i,j+1).reverse());improved=true;}}}}
  return ord;
}

function sortClustersByOrigin(clusters,originCoord){
  if(!originCoord||clusters.length<=1) return clusters;
  const centroids=clusters.map(g=>({lat:g.reduce((s,p)=>s+p.lat,0)/g.length,lng:g.reduce((s,p)=>s+p.lng,0)/g.length}));
  const visited=new Array(clusters.length).fill(false),order=[];
  let cur={lat:originCoord[0],lng:originCoord[1]};
  for(let step=0;step<clusters.length;step++){
    let best=-1,bd=Infinity;
    centroids.forEach((c,i)=>{if(visited[i])return;const d=haversine(cur,c);if(d<bd){bd=d;best=i;}});
    visited[best]=true;order.push(clusters[best]);cur=centroids[best];
  }
  return order;
}

}

// ── 자동 추천 ─────────────────────────────────────────────────
function autoRecommend(){
  const schools=filteredSchools();
  // 이미 배정된 학교 제외
  const unassigned=schools.filter(s=>S.assignments[s.id]===undefined);
  if(!unassigned.length){toast('미배정 학교가 없습니다');return;}

  // 각 Day에 이미 배정된 수 계산
  const counts=Array.from({length:S.days},(_,i)=>Object.values(S.assignments).filter(d=>d===i).length);
  const target=Math.ceil(schools.length/S.days);

  // 균등 클러스터링으로 미배정 학교 배분
  const labels=balancedKmeans(unassigned,Math.min(S.days,unassigned.length));
  // Day 순서는 출발지 기준으로 정렬
  const groups=Array.from({length:S.days},()=>[]);
  unassigned.forEach((s,i)=>{const di=labels[i]||0;groups[di].push(s);});
  const validGroups=groups.filter(g=>g.length);
  const sorted=sortClustersByOrigin(validGroups,S.originCoord);

  // 남은 Day 슬롯에 배정
  let dayPtr=0;
  sorted.forEach(group=>{
    // 다음 여유 있는 Day 찾기
    while(dayPtr<S.days&&counts[dayPtr]>=target) dayPtr++;
    if(dayPtr>=S.days) dayPtr=S.days-1;
    group.forEach(s=>{S.assignments[s.id]=dayPtr;updateSchoolMarker(s.id);});
    counts[dayPtr]+=group.length;
    dayPtr++;
  });

  updateDaySelectorCounts();
  toast(`✨ ${unassigned.length}개 학교 자동 배정 완료!`);
}

// ── 완료 → 결과 생성 ─────────────────────────────────────────
async function finishManual(){
  const schools=filteredSchools();
  const assigned=schools.filter(s=>S.assignments[s.id]!==undefined);
  if(!assigned.length){toast('배정된 학교가 없습니다');return;}

  const groups=Array.from({length:S.days},()=>[]);
  schools.forEach(s=>{const di=S.assignments[s.id];if(di!==undefined)groups[di].push(s);});
  const validGroups=groups.filter(g=>g.length);

  document.getElementById('day-selector').style.display='none';
  mapMode='result';
  toast('⏳ 도로 기반 경로 최적화 중...');

  const destCoord=S.destCoord||S.originCoord;
  const optimized=[];
  for(const g of validGroups){
    const ord = await optimizeRouteOSRM(g, S.originCoord, destCoord);
    optimized.push(ord.map(i=>g[i]));
  }
  const sorted=sortClustersByOrigin(optimized,S.originCoord);

  S.currentClusters=sorted;
  S_day=0;
  renderResult(sorted);
  document.getElementById('result-tab').style.display='block';
  switchTab('result');
}

// ── 결과 렌더 ─────────────────────────────────────────────────
function calcDayDist(group){
  if(!group.length) return 0;
  let dist=0;
  for(let i=1;i<group.length;i++) dist+=haversine(group[i-1],group[i]);
  if(S.originCoord) dist+=haversine({lat:S.originCoord[0],lng:S.originCoord[1]},group[0]);
  if(S.destCoord) dist+=haversine(group[group.length-1],{lat:S.destCoord[0],lng:S.destCoord[1]});
  return dist;
}

// ── OSRM 실제 도로 기반 경로 최적화 ─────────────────────────
async function optimizeRouteOSRM(pts, startCoord, destCoord) {
  if(!pts.length) return pts.map((_,i)=>i);
  if(pts.length===1) return [0];

  try {
    // 출발지 + 학교들 + 도착지 좌표 목록
    const allPts = [];
    if(startCoord) allPts.push({lat:startCoord[0],lng:startCoord[1]});
    pts.forEach(p=>allPts.push({lat:p.lat,lng:p.lng}));
    const endCoord = destCoord||startCoord;
    if(endCoord) allPts.push({lat:endCoord[0],lng:endCoord[1]});

    // 동일 좌표 미세 조정 (OSRM 오류 방지)
    const seen = new Set();
    allPts.forEach((p,i)=>{
      const key = `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
      if(seen.has(key)){
        // 미세하게 좌표 이동 (약 1m)
        allPts[i] = {lat: p.lat + (Math.random()-0.5)*0.00002, lng: p.lng + (Math.random()-0.5)*0.00002};
      }
      seen.add(key);
    });

    const coordStr = allPts.map(p=>`${p.lng},${p.lat}`).join(';');
    const url = `https://router.project-osrm.org/table/v1/driving/${coordStr}?annotations=duration`;

    toast('⏳ 실제 도로 거리 계산 중...');

    // 5초 타임아웃
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);

    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    if(!res.ok) throw new Error('OSRM 오류');
    const data = await res.json();
    if(data.code !== 'Ok') throw new Error('OSRM 응답 오류');

    const matrix = data.durations; // 초 단위 이동 시간 행렬
    const n = pts.length;
    const offset = startCoord ? 1 : 0; // 출발지가 있으면 인덱스 1부터 학교

    // Nearest Neighbor TSP (실제 도로 시간 기반)
    const startIdx = offset; // 출발지 다음이 첫 학교
    const visited = new Array(allPts.length).fill(false);
    visited[0] = true; // 출발지 방문 처리
    const ord = [];
    let cur = startIdx - 1; // 출발지 인덱스

    for(let i=0; i<n; i++) {
      let best=-1, bd=Infinity;
      for(let j=offset; j<offset+n; j++) {
        if(visited[j]) continue;
        const t = matrix[cur][j];
        if(t<bd){bd=t;best=j;}
      }
      visited[best]=true;
      ord.push(best-offset); // 학교 인덱스로 변환
      cur=best;
    }

    // 2-opt 개선 (도로 시간 기반)
    let improved=true;
    while(improved){
      improved=false;
      for(let i=0;i<n-1;i++){
        for(let j=i+1;j<n;j++){
          const a=i===0?(offset-1):offset+ord[i-1];
          const b=offset+ord[i];
          const c=offset+ord[j];
          const d=j===n-1?(offset+n):offset+ord[j+1];
          const before=matrix[a][b]+matrix[c][d];
          const after=matrix[a][c]+matrix[b][d];
          if(after<before-0.01){
            ord.splice(i,j-i+1,...ord.slice(i,j+1).reverse());
            improved=true;
          }
        }
      }
    }

    const totalTime = matrix[offset-1<0?0:offset-1][offset+ord[0]];
    toast(`✅ 도로 기반 최적화 완료! (OSRM)`);
    return ord;

  } catch(e) {
    console.warn('OSRM 실패, 직선거리로 fallback:', e);
    toast('⚠️ 도로 계산 실패 → 직선거리로 대체');
    return optimizeRoute(pts, startCoord, destCoord);
  }
}

      html += `<tr>
        <td class="num-col">${num}</td>
        <td class="school-col">${s.name}</td>
        <td class="type-col">${type}</td>
        <td class="visit-col"></td>
        <td class="memo-col"></td>
      </tr>`;
    });

    html += `</tbody>
  </table>
  <div class="footer">루트플래너 · ${today}</div>
</div>`;
  });

  html += `<script>window.onload=function(){window.print();}<\/script></body></html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

// 저장 시 루트 이름 기억
let S_routeName = '';

function moveStopBySelect(di,si,sel){
  const tdi=parseInt(sel.value);
  if(isNaN(tdi)) return;
  sel.value=''; // 초기화
  moveStop(di,si,tdi);
}
function moveStop(di,si,tdi){const s=S.currentClusters[di].splice(si,1)[0];S.currentClusters[tdi].push(s);renderDayDetail(di);renderDayTabs();showDayOnMap(di);toast(`Day ${tdi+1}로 이동`);}

// ── 학교 추가 모달 ────────────────────────────────────────────
function openSchoolModal(di){S.addingToDay=di;document.getElementById('school-search-input').value='';document.getElementById('school-results').innerHTML='';document.getElementById('school-results').style.display='none';document.getElementById('school-overlay').classList.add('open');}
function closeSchoolModal(){document.getElementById('school-overlay').classList.remove('open');S.addingToDay=null;}
function searchSchool(q){
  const el=document.getElementById('school-results');
  if(q.length<1){el.style.display='none';return;}
  const matches=ALL_SCHOOLS.filter(s=>s.name.includes(q)||s.addr.includes(q)).slice(0,10);
  if(!matches.length){el.innerHTML='<div class="school-item" style="color:var(--text3)">검색 결과 없음</div>';el.style.display='block';return;}
  el.innerHTML=matches.map(s=>`<div class="school-item" onclick="addStop('${encodeURIComponent(JSON.stringify(s))}')"><div style="font-weight:500">${s.name}</div><div style="font-size:11px;color:var(--text3)">${s.type}·${s.addr}</div></div>`).join('');
  el.style.display='block';
}
function addStop(enc){const s=JSON.parse(decodeURIComponent(enc));S.currentClusters[S.addingToDay].push(s);closeSchoolModal();renderDayDetail(S.addingToDay);renderDayTabs();showDayOnMap(S.addingToDay);toast(`${s.name} 추가됨`);}

// ── Auth ──────────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err'),btn=document.getElementById('login-btn');
  if(!email||!pw){err.textContent='이메일과 비밀번호를 입력해주세요';return;}
  btn.disabled=true;btn.textContent='로그인 중...';err.textContent='';
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const data=await res.json();
    if(data.error||!data.access_token){err.textContent='이메일 또는 비밀번호가 올바르지 않습니다';btn.disabled=false;btn.textContent='로그인';return;}
    localStorage.setItem('rp_token',data.access_token);localStorage.setItem('rp_refresh',data.refresh_token);currentUser=data.user;onLoginSuccess();
  }catch(e){err.textContent='네트워크 오류';btn.disabled=false;btn.textContent='로그인';}
}
async function checkSession(){
  const token=localStorage.getItem('rp_token');if(!token) return false;
  try{const res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${token}`}});if(!res.ok) return await refreshToken();currentUser=await res.json();return true;}
  catch(e){return false;}
}
async function refreshToken(){
  const refresh=localStorage.getItem('rp_refresh');if(!refresh) return false;
  try{const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});const data=await res.json();if(!data.access_token) return false;localStorage.setItem('rp_token',data.access_token);localStorage.setItem('rp_refresh',data.refresh_token);currentUser=data.user;return true;}
  catch(e){return false;}
}
async function doLogout(){
  try{await fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${localStorage.getItem('rp_token')}`}});}catch(e){}
  localStorage.removeItem('rp_token');localStorage.removeItem('rp_refresh');currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-email').value='';document.getElementById('login-pw').value='';
  document.getElementById('login-btn').disabled=false;document.getElementById('login-btn').textContent='로그인';
}
function onLoginSuccess(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('user-email').textContent=currentUser?.email||'';
  renderFixedPlaces();loadSchools();renderSaved();
}

// ── 저장/불러오기 ─────────────────────────────────────────────
function saveRoute(){document.getElementById('route-name-input').value='';document.getElementById('route-overlay').classList.add('open');}
function closeRouteModal(){document.getElementById('route-overlay').classList.remove('open');}
async function confirmSaveRoute(){
  const name=document.getElementById('route-name-input').value.trim();
  if(!name){toast('이름을 입력해주세요');return;}
  if(!currentUser){toast('로그인이 필요합니다');return;}
  S.currentRouteName = name;
  try{
    const res=await authFetch('saved_routes',{method:'POST',body:JSON.stringify({user_id:currentUser.id,name,clusters:S.currentClusters,origin_text:S.originText,dest_text:S.destText,origin_coord:S.originCoord,dest_coord:S.destCoord})});
    if(!res.ok){
      const errText = await res.text();
      console.error('저장 실패:', res.status, errText);
      toast(`저장 실패 (${res.status})`);
      return;
    }
    closeRouteModal();toast(`"${name}" 저장됨`);renderSaved();
  }catch(e){
    console.error('저장 오류:', e);
    toast('저장 실패: 네트워크 오류');
  }
}
async function renderSaved(){
  const el=document.getElementById('saved-list');if(!currentUser){el.innerHTML='<div class="empty-state">로그인이 필요합니다</div>';return;}
  el.innerHTML='<div class="empty-state">불러오는 중...</div>';
  try{
    const res=await authFetch('saved_routes?select=*&order=created_at.desc&limit=50');
    const routes=await res.json();S.routes=routes;
    if(!routes.length){el.innerHTML='<div class="empty-state">🗺️<br><br>저장된 루트가 없습니다</div>';return;}
    el.innerHTML=routes.map((r,i)=>`<div class="saved-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div onclick="loadSaved(${i})" style="flex:1;cursor:pointer"><div class="saved-name">${r.name}</div><div class="saved-meta">${new Date(r.created_at).toLocaleDateString('ko-KR')} · ${r.clusters?.length||0}일 · ${r.clusters?.reduce((s,g)=>s+g.length,0)||0}개 학교</div></div><button onclick="deleteSaved('${r.id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0 4px">✕</button></div></div>`).join('');
  }catch(e){el.innerHTML='<div class="empty-state">불러오기 실패</div>';}
}
function loadSaved(i){
  const r=S.routes[i];S.currentClusters=r.clusters;S.originText=r.origin_text||'';S.destText=r.dest_text||'';S.originCoord=r.origin_coord;S.destCoord=r.dest_coord;
  if(S.originCoord) document.getElementById('origin-input').value=S.originText;
  if(S.destCoord) document.getElementById('dest-input').value=S.destText;
  S_day=0;renderResult(r.clusters);
  document.getElementById('result-tab').style.display='block';switchTab('result');
}
async function deleteSaved(id){if(!confirm('삭제할까요?')) return;try{await authFetch(`saved_routes?id=eq.${id}`,{method:'DELETE'});toast('삭제됨');renderSaved();}catch(e){toast('삭제 실패');}}

// ── 탭/토스트 ─────────────────────────────────────────────────
function switchTab(tab){
  ['plan','result','saved'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===tab?'block':'none';});
  document.getElementById('footer-plan').style.display=tab==='plan'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',['plan','result','saved'][i]===tab);});
  if(tab==='saved') renderSaved();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ── 초기화 ────────────────────────────────────────────────────
window.addEventListener('load',async()=>{
  loadLink('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  initMap();
  const loggedIn=await checkSession();
  if(loggedIn) onLoginSuccess();
  else document.getElementById('login-screen').style.display='flex';
});
</script>
